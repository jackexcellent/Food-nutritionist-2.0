# Diet Tracker Bot - Pytest 配置

[tool:pytest]
testpaths = tests
minversion = 6.0
addopts = -ra --strict-markers --strict-config --tb=short
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    unit: 單元測試 - 測試單一函數或類別
    integration: 整合測試 - 測試模組間交互
    e2e: 端到端測試 - 測試完整用戶流程
    performance: 性能測試 - 測試執行速度和資源使用
    stress: 壓力測試 - 測試系統極限和穩定性
    slow: 慢速測試 - 執行時間較長的測試
    external: 外部依賴測試 - 需要網路或外部服務
    mock: Mock 測試 - 使用模擬對象的測試
    database: 資料庫測試 - 測試資料庫操作
    cache: 快取測試 - 測試快取機制
    discord: Discord 機器人測試
    api: API 測試 - 測試外部 API 調用

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S